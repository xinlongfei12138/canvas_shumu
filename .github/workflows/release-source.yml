name: Release source package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r "infinite-canvas-${GITHUB_REF_NAME}.zip" . \
            -x "*/node_modules/*" "*/dist/*" "web/public/plugins/*" "data/*" ".git/*" ".update-config.json"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: infinite-canvas-${{ github.ref_name }}.zip
